name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check Firebase deployment configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_SHELF }}
        run: |
          test -n "$FIREBASE_OPTIONS_DART" || { echo "Missing FIREBASE_OPTIONS_DART repository secret"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "Missing FIREBASE_SERVICE_ACCOUNT_APP_SHELF repository secret"; exit 1; }

      - name: Prepare placeholder Firebase options
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s\n' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          else
            cp lib/firebase_options.example.dart lib/firebase_options.dart
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_SHELF }}
          projectId: app-shelfsense
          channelId: live
