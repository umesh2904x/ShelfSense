name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check Firebase deployment configuration
        id: firebase-deploy-config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_SHELF }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping live deploy; configure FIREBASE_OPTIONS_DART and FIREBASE_SERVICE_ACCOUNT_APP_SHELF repository secrets."
          fi

      - name: Prepare placeholder Firebase options
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s\n' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          else
            cp lib/firebase_options.example.dart lib/firebase_options.dart
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        if: steps.firebase-deploy-config.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_SHELF }}

      - name: Set up Node.js
        if: steps.firebase-deploy-config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: steps.firebase-deploy-config.outputs.enabled == 'true'
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules and Hosting
        if: steps.firebase-deploy-config.outputs.enabled == 'true'
        run: firebase deploy --only "firestore:rules,hosting" --project app-shelfsense
