<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Track groceries, medicine, soap, skincare and everyday essentials with ShelfSense.">
  <meta name="theme-color" content="#f5f7f4">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShelfSense">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShelfSense</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background: #f5f7f4;
      font-family: Arial, sans-serif;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      color: #29372f;
      background: #f5f7f4;
      z-index: 10;
    }

    #app-loading-mark {
      display: grid;
      width: 64px;
      height: 64px;
      place-items: center;
      color: #34785a;
      background: #e7f2eb;
      border-radius: 20px;
      font-size: 28px;
      font-weight: 700;
    }

    #app-loading-message {
      color: #7b887f;
      font-size: 14px;
    }

    #app-loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #dce9df;
      border-top-color: #34785a;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }

    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div id="app-loading-mark" aria-hidden="true">S</div>
    <strong>ShelfSense</strong>
    <div id="app-loading-message">Getting things ready…</div>
    <div id="app-loading-spinner" aria-hidden="true"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
